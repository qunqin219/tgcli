name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18.20', '20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: |
          node --check bin/tgcli.js
          node --check src/api.js
          node --check src/cli.js
          node --check src/store.js
      - name: Test
        run: node --test
      - name: CLI smoke (help + version)
        run: |
          node bin/tgcli.js version
          node bin/tgcli.js help | head -5

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm pack --dry-run
